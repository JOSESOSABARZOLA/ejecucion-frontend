# Nginx Configuration for React SPA
# Serves static files and redirects all non-file requests to index.html (SPA routing)

# Resolver for dynamic hostname resolution (required for Docker service name resolution)
# Uses Docker's internal DNS (127.0.0.11:53)
resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;

server {
    listen 5173;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Root directory for static files
    root /usr/share/nginx/html;

    # Health check endpoint (must be before /api/ and / to be matched first)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy: Forward all /api/* requests to backend (http://ejecucion-app:3000)
    # This avoids CORS issues since requests come from same origin (localhost:5173)
    # Rewrites /api/auth/login → /auth/login before sending to backend
    # CRITICAL: Must be BEFORE location / to take precedence
    # Los documentos (PDF) también viajan por aquí: el navegador pide
    # /api/fileserver/ejecucion/<tipo>/AAAA/MM/<archivo>.pdf y el rewrite lo deja en
    # /fileserver/ejecucion/... para el backend, que lo sirve con la sesión (cookie) del usuario.
    # No hay bloque propio para el fileserver: el Gateway de QA/producción solo enruta /api.
    # `^~`: fuerza que este prefijo gane sobre los location con regex de abajo. Sin él bastaría con
    # que alguien añadiera `pdf` a la lista de assets cacheados para que el regex se llevara el
    # documento y nginx sirviera el index.html en vez del PDF ("Invalid PDF structure" en el visor).
    location ^~ /api/ {
        set $backend_url http://ejecucion-app:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # TECHO DE PARED DE TODA LA API. Antes no estaba declarado, así que regía el DEFAULT de nginx
        # —60 s— y era invisible: el bloque /socket.io/ de abajo sí lo declara, lo que hacía fácil
        # creer que aquí también había algo. Se escribe el MISMO valor por defecto: no cambia nada en
        # runtime y hace visible el límite que gobierna al peticionario más lento de la aplicación,
        # que es el combo de firma de actas (FE:src/services/SorteoService.ts, COMBO_FIRMA_TIMEOUT_MS
        # = 45 s, deliberadamente por debajo de estos 60 para que aborte el navegador con su mensaje
        # y no nginx con un 504 opaco). Medido el 2026-08-13 (Q3): un combo de 20 pares en la orden 3
        # cuesta ~3 s, así que hay más de 15 veces de margen. Si algún día se sube el timeout del
        # cliente, ESTE número tiene que subir ANTES.
        proxy_read_timeout 60s;

        # Handle preflight CORS requests
        # CORS: lo gobierna el backend (origen explicito + credenciales). Ver Fase 03.11.
        # Las cabeceras permitidas incluyen ahora los identificadores de traza (correlacion), y esa
        # lista vive en la configuracion CORS del backend, NO aqui: mantenerla en dos sitios garantiza
        # que un dia difieran.
        # Se retiro el 'Access-Control-Allow-Origin: *' que anunciaba este bloque: un origen comodin es
        # incompatible con credenciales, asi que si algun ambiente llegara a servir el frontend desde
        # otro origen las cookies dejarian de viajar EN SILENCIO. Hoy nginx proxya desde el mismo
        # origen y este bloque es codigo muerto, por eso retirarlo es seguro.
        # OJO para el dia que exista un despliegue con origenes separados: este 'if' INTERCEPTA el
        # preflight y nunca lo reenvia al backend, asi que habria que borrar el bloque entero para que
        # responda quien de verdad gobierna el CORS.
        if ($request_method = 'OPTIONS') {
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Socket.io (WebSocket) proxy: reenvía /socket.io/ al gateway del backend con upgrade.
    # Necesario para las alertas en tiempo real (AlertsWsGateway). Sin rewrite: socket.io
    # usa el path /socket.io tal cual. Debe ir ANTES de location / (prefijo más largo).
    location /socket.io/ {
        set $backend_ws http://ejecucion-app:3000;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache control for assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML files - no cache (allows updates without clearing browser cache)
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # SPA routing: redirect all non-file requests to index.html
    # This is the default handler, must be LAST
    location / {
        try_files $uri $uri/ /index.html;
    }
}
